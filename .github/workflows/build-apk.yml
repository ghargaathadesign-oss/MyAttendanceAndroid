name: Build My Attendance APK

on:
  workflow_dispatch:
  push:
    branches: [main, v12.6-hardening, v12.7-device-auth, v12.8-restore-compat, v12.9-step7-delete, v13.0-step9-r8, v13.1-step12-diagnostics]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare supplied app icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon.webp.b64 > app/src/main/res/drawable/app_icon.webp
          test -s app/src/main/res/drawable/app_icon.webp

      - name: Prepare v13.1 app
        shell: bash
        run: |
          set -e
          cat ci/v83_bundle.part* > /tmp/v83_bundle.b64
          test "$(wc -c < /tmp/v83_bundle.b64)" = "61564"
          base64 -d /tmp/v83_bundle.b64 > /tmp/v83_bundle.zip
          echo "e71c15e01ff07294f2df5989d88ff25704f8024c97323d40a7d3bb04e2415904  /tmp/v83_bundle.zip" | sha256sum -c -
          rm -f app/src/main/assets/index.html app/src/main/assets/app.css app/src/main/assets/app.js app/src/main/assets/extras.js app/src/main/assets/extras.css app/src/main/assets/navfix.js app/src/main/assets/lottie-runtime.js app/src/main/assets/profile-ui.js app/src/main/assets/cloud-ui.js app/src/main/assets/cloud-ui.css app/src/main/assets/v11-ui.js app/src/main/assets/v11-ui.css app/src/main/assets/v111-fixes.js app/src/main/assets/v112-fixes.js app/src/main/assets/v112-ui.css app/src/main/assets/v113-fixes.js app/src/main/assets/v113-ui.css app/src/main/assets/user-storage.js app/src/main/assets/document-crypto.js app/src/main/assets/xlsx.full.min.js app/src/main/assets/exceljs.min.js app/src/main/assets/firebase-config.json app/src/main/assets/policy-engine.js app/src/main/assets/backup-crypto.js
          rm -rf app/src/main/assets/lottie app/src/main/assets/lottie-dark app/src/main/assets/lottie-white
          unzip -q -o /tmp/v83_bundle.zip -d app/src/main/assets

          cat ci/v9code.fix01a ci/v9code.fix01b ci/v9code.fix02a ci/v9code.fix02b ci/v9code.part03 ci/v9code.part04 > /tmp/v9code.b64
          test "$(wc -c < /tmp/v9code.b64)" = "24804"
          sed -i 's/H5dHCgTTiQ/H5dHCgTTgQ/' /tmp/v9code.b64
          base64 -d /tmp/v9code.b64 > /tmp/v9code.zip
          echo "3d9c671ef4c4cfd2165c7ab4320e31a36089e76190a0fb2e7ef1e191cce7b228  /tmp/v9code.zip" | sha256sum -c -
          unzip -q -o /tmp/v9code.zip -d app/src/main/assets

          python3 ci/prepare_v94.py app/src/main/assets
          python3 ci/patch_v95.py app/src/main/assets
          cp ci/cloud-ui.js app/src/main/assets/cloud-ui.js
          cp ci/cloud-ui.css app/src/main/assets/cloud-ui.css
          python3 ci/patch_v10.py app/src/main/assets
          python3 ci/patch_v11.py app/src/main/assets
          python3 ci/patch_v111.py app/src/main/assets
          cp ci/v11-ui.js app/src/main/assets/v11-ui.js
          cp ci/v11-ui.css app/src/main/assets/v11-ui.css
          cp ci/v111-fixes.js app/src/main/assets/v111-fixes.js
          cp ci/v112-fixes.js app/src/main/assets/v112-fixes.js
          cp ci/v112-ui.css app/src/main/assets/v112-ui.css
          cp ci/v113-fixes.js app/src/main/assets/v113-fixes.js
          cp ci/v113-ui.css app/src/main/assets/v113-ui.css
          python3 ci/patch_v112.py app/src/main/assets
          python3 ci/patch_v113.py app/src/main/assets
          cp ci/user-storage-v123.js app/src/main/assets/user-storage.js
          cp ci/document-crypto.js app/src/main/assets/document-crypto.js
          python3 ci/patch_v12.py app/src/main/assets
          python3 ci/patch_native_v11.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v12.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v121.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v123.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v124.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_v122.py app/src/main/assets
          python3 ci/patch_v124.py app/src/main/assets
          python3 ci/patch_v125.py app/src/main/assets
          cp ci/policy-engine.js app/src/main/assets/policy-engine.js
          cp ci/backup-crypto.js app/src/main/assets/backup-crypto.js
          cp ci/user-storage-v126.js app/src/main/assets/user-storage.js
          cp ci/cloud-ui-v126.js app/src/main/assets/cloud-ui.js
          python3 ci/patch_v126.py app/src/main/assets
          python3 ci/patch_native_v126.py app/src/main/java/com/personal/attendance/MainActivity.java
          cp ci/cloud-ui-v127.js app/src/main/assets/cloud-ui.js
          python3 ci/patch_v127.py app/src/main/assets
          python3 ci/patch_native_v127.py app/src/main/java/com/personal/attendance/MainActivity.java
          cp ci/transfer-crypto.js app/src/main/assets/transfer-crypto.js
          python3 ci/patch_v128.py app/src/main/assets
          python3 ci/patch_native_v128.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_v129.py app/src/main/assets
          python3 ci/patch_native_v129.py app/src/main/java/com/personal/attendance/MainActivity.java
          cp ci/diagnostics-core.js app/src/main/assets/diagnostics-core.js
          cp ci/diagnostics-ui.js app/src/main/assets/diagnostics-ui.js
          cp ci/diagnostics-ui.css app/src/main/assets/diagnostics-ui.css
          python3 ci/patch_v131.py app/src/main/assets
          python3 ci/patch_native_v131.py app/src/main/java/com/personal/attendance/MainActivity.java
          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js -o app/src/main/assets/lottie.min.js
          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          curl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js -o app/src/main/assets/exceljs.min.js
          cp ci/lottie-runtime.js app/src/main/assets/lottie-runtime.js

          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.css
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/profile-ui.js
          test -s app/src/main/assets/cloud-ui.js
          test -s app/src/main/assets/cloud-ui.css
          test -s app/src/main/assets/lottie-runtime.js
          test -s app/src/main/assets/v11-ui.js
          test -s app/src/main/assets/v11-ui.css
          test -s app/src/main/assets/v111-fixes.js
          test -s app/src/main/assets/v112-fixes.js
          test -s app/src/main/assets/v112-ui.css
          test -s app/src/main/assets/v113-fixes.js
          test -s app/src/main/assets/v113-ui.css
          test -s app/src/main/assets/user-storage.js
          test -s app/src/main/assets/document-crypto.js
          test -s app/src/main/assets/policy-engine.js
          test -s app/src/main/assets/backup-crypto.js
          test -s app/src/main/assets/transfer-crypto.js
          test -s app/src/main/assets/diagnostics-core.js
          test -s app/src/main/assets/diagnostics-ui.js
          test -s app/src/main/assets/diagnostics-ui.css
          test -s app/src/main/assets/xlsx.full.min.js
          test -s app/src/main/assets/exceljs.min.js
          test -s app/src/main/assets/lottie-dark/attendance.json
          test -s app/src/main/assets/lottie-white/punch.json
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/profile-ui.js
          node --check app/src/main/assets/cloud-ui.js
          node --check app/src/main/assets/lottie-runtime.js
          node --check app/src/main/assets/v11-ui.js
          node --check app/src/main/assets/v111-fixes.js
          node --check app/src/main/assets/v112-fixes.js
          node --check app/src/main/assets/v113-fixes.js
          node --check app/src/main/assets/user-storage.js
          node --check app/src/main/assets/document-crypto.js
          node --check app/src/main/assets/policy-engine.js
          node --check app/src/main/assets/backup-crypto.js
          node --check app/src/main/assets/transfer-crypto.js
          node --check app/src/main/assets/diagnostics-core.js
          node --check app/src/main/assets/diagnostics-ui.js
          node ci/test-policy.js
          node ci/test-backup-crypto.js
          node ci/test-transfer-crypto.js
          node ci/test-diagnostics.js
          grep -q 'window.initLottie' app/src/main/assets/lottie-runtime.js
          grep -q 'exceljs.min.js' app/src/main/assets/index.html
          grep -q 'deleteProfileBtn' app/src/main/assets/index.html
          grep -q 'exportExcelBtn' app/src/main/assets/index.html
          grep -q 'workProgressRing' app/src/main/assets/index.html
          grep -q 'settingsLogoutBtn' app/src/main/assets/index.html
          grep -q 'fontFamilySelect' app/src/main/assets/index.html
          grep -q 'v112-fixes.js' app/src/main/assets/index.html
          grep -q 'v113-fixes.js' app/src/main/assets/index.html
          grep -q 'user-storage.js' app/src/main/assets/index.html
          grep -q 'attendanceUserDb' app/src/main/assets/app.js
          grep -q 'attendanceSnapshotCurrentUser' app/src/main/assets/cloud-ui.js
          grep -q 'currentUserUid' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'PlayIntegrityAppCheckProviderFactory' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'firebase-appcheck-playintegrity' app/build.gradle
          grep -q 'secureStorageAvailable' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'my_attendance_local_aes_v1' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'attendanceSecureLocalStorage' app/src/main/assets/user-storage.js
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'attendanceDocEncryptFile' app/src/main/assets/app.js
          grep -q 'encVersion:2' app/src/main/assets/document-crypto.js
          grep -q 'Protected by your phone security' app/src/main/assets/index.html
          if grep -q 'backupRecoveryPassword' app/src/main/assets/index.html; then exit 1; fi
          if grep -q 'saveBackupRecoveryBtn' app/src/main/assets/index.html; then exit 1; fi
          grep -q 'PBKDF2-HMAC-SHA256' app/src/main/assets/backup-crypto.js
          grep -q 'secureReplacePrefix' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'WebViewAssetLoader' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'deleteAccountDataWithPassword' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'androidx.webkit:webkit:1.16.0' app/build.gradle
          grep -q 'androidx.biometric:biometric:1.1.0' app/build.gradle
          grep -q 'BiometricPrompt' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'secureCloudBackup' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'secureCloudRestore' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'cloudTransferBackup' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'cloudTransferRestore' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'compositeBackupBase' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'deleteUserCryptoArtifacts' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'deletionInProgress' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'Removing cloud backup' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'Nothing local was erased' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'pendingDeleteGoogle=false' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'attendanceClearCurrentUser' app/src/main/assets/v11-ui.js
          grep -q 'window.onProfileDeleteProgress' app/src/main/assets/v11-ui.js
          grep -q 'cloud backup (including switch-device backup)' app/src/main/assets/v11-ui.js
          if grep -q "clearLocalEverything();if(window.Android&&Android.googleSignOut)" app/src/main/assets/v11-ui.js; then exit 1; fi
          grep -q 'BACKUP_KEY_ALIAS_PREFIX' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'FIREBASE_APP_CHECK_ENABLED' app/src/main/java/com/personal/attendance/MainActivity.java
          if grep -q 'private void withAppCheck' app/src/main/java/com/personal/attendance/MainActivity.java; then exit 1; fi
          grep -q 'minifyEnabled true' app/build.gradle
          if grep -q 'minifyEnabled false' app/build.gradle; then exit 1; fi
          grep -q '@android.webkit.JavascriptInterface <methods>;' app/proguard-rules.pro
          grep -q 'RuntimeVisibleAnnotations' app/proguard-rules.pro
          grep -q 'Diagnostics & Recovery' app/src/main/assets/index.html
          grep -q 'Export Support Report' app/src/main/assets/index.html
          grep -q 'Repair Compatible Data' app/src/main/assets/index.html
          grep -q 'AttendanceDiagnostics.inspectStorage' app/src/main/assets/diagnostics-ui.js
          grep -q 'No email, UID, salary amount' app/src/main/assets/diagnostics-core.js
          grep -q 'diagnosticsSummaryNative' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'diagnosticsCloudBackupNative' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'clearDiagnosticsCacheNative' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q '@JavascriptInterface public String diagnosticsSummary' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'profileDangerZone' app/src/main/assets/index.html
          grep -q 'confirmClockOut' app/src/main/assets/app.js
          grep -q 'isSpecialOTRecord' app/src/main/assets/app.js
          if grep -q '<script src="v111-fixes.js"' app/src/main/assets/index.html; then exit 1; fi
          grep -q 'dailyBalanceMinutes' app/src/main/assets/app.js
          grep -q 'Standard day: 9h 00m' app/src/main/assets/index.html
          if grep -q 'Standard day: 8h 00m' app/src/main/assets/index.html; then exit 1; fi
          grep -q 'AttendancePolicy.salaryMonth' app/src/main/assets/app.js
          grep -q 'AttendancePolicy.balanceMinutes' app/src/main/assets/v112-fixes.js
          grep -q 'secureCloudBackup' app/src/main/assets/cloud-ui.js
          grep -q 'oldRecoveryPassword' app/src/main/assets/cloud-ui.js
          grep -q 'Backup for New Device' app/src/main/assets/index.html
          grep -q 'Restore on New Device' app/src/main/assets/index.html
          grep -q 'cloudTransferBackup' app/src/main/assets/cloud-ui.js
          grep -q 'normalizeStorage' app/src/main/assets/cloud-ui.js
          grep -q 'AttendanceTransferCrypto' app/src/main/assets/transfer-crypto.js
          grep -q 'Short Day' app/src/main/assets/policy-engine.js
          grep -q 'Documents are encrypted with Android Keystore and stored only on this device' app/src/main/assets/index.html
          if grep -q 'RE-PUNCH' app/src/main/assets/app.js; then exit 1; fi
          echo "v13.1 assets prepared successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Firebase build secret
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            echo "FIREBASE_API_KEY repository secret is missing."
            exit 1
          fi
          echo "Firebase build secret is configured."

      - name: Build unsigned release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_CHECK_ENABLED: ${{ secrets.FIREBASE_APP_CHECK_ENABLED }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify R8 shrinking and bridge safety
        shell: bash
        run: |
          set -euo pipefail
          MAP="app/build/outputs/mapping/release/mapping.txt"
          test -s "$MAP"
          grep -q 'com.personal.attendance.MainActivity' "$MAP"
          grep -E -q 'secureCloudBackup\(.*\).* -> secureCloudBackup$' "$MAP"
          grep -E -q 'secureCloudRestore\(.*\).* -> secureCloudRestore$' "$MAP"
          grep -E -q 'cloudTransferBackup\(.*\).* -> cloudTransferBackup$' "$MAP"
          grep -E -q 'deleteAccountDataWithPassword\(.*\).* -> deleteAccountDataWithPassword$' "$MAP"
          grep -E -q 'diagnosticsSummary\(.*\).* -> diagnosticsSummary$' "$MAP"
          grep -E -q 'diagnosticsCloudBackup\(.*\).* -> diagnosticsCloudBackup$' "$MAP"
          grep -E -q 'clearDiagnosticsCache\(.*\).* -> clearDiagnosticsCache$' "$MAP"
          python3 -c "from pathlib import Path; p=Path('app/build/outputs/mapping/release/mapping.txt'); lines=p.read_text(errors='replace').splitlines(); pairs=[line[:-1].split(' -> ',1) for line in lines if line and not line.startswith(' ') and ' -> ' in line and line.endswith(':')]; changed=sum(1 for a,b in pairs if a!=b); print(f'R8 verified: {changed} of {len(pairs)} mapped classes have obfuscated names'); assert pairs and changed"
          sha256sum "$MAP" > app/build/outputs/mapping/release/mapping.txt.sha256
          echo "R8 mapping verified internally. Mapping file is intentionally not uploaded because this repository is public."

      - name: Prepare APK and official build tools
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/My-Attendance-v13.1-unsigned.apk
          tar -czf output/android-build-tools-35.tar.gz -C "$ANDROID_HOME/build-tools" 35.0.0

      - name: Sign APK with permanent release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Permanent Android signing secrets are not configured yet."
            echo "SIGNED_APK_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/my-attendance-release.jks"
          ALIGNED="$RUNNER_TEMP/My-Attendance-v13.1-aligned.apk"
          SIGNED="output/My-Attendance-v13.1-signed.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -P 16 4 output/My-Attendance-v13.1-unsigned.apk "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$KEYSTORE"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$SIGNED"             "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED" | tee output/apksigner-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$SIGNED"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" output/apksigner-report.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" output/apksigner-report.txt
          grep -q "65cf75b838c0cc6b2bcf13c7b6fb7641be5a0336ff84fd18e1fe2c1a6ed5ce2f" output/apksigner-report.txt
          rm -f "$KEYSTORE" "$ALIGNED"
          echo "SIGNED_APK_AVAILABLE=1" >> "$GITHUB_ENV"

      - name: Verify release package metadata
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="output/My-Attendance-v13.1-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$SIGNED" | tee output/package-badging.txt
          grep -q "package: name='com.personal.attendance'" output/package-badging.txt
          grep -q "versionCode='21'" output/package-badging.txt
          grep -q "versionName='3.5'" output/package-badging.txt
          sha256sum "$SIGNED" | tee output/My-Attendance-v13.1-signed.apk.sha256

      - name: Upload signed APK artifact
        if: env.SIGNED_APK_AVAILABLE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: My-Attendance-v13.1-Signed-APK
          path: |
            output/My-Attendance-v13.1-signed.apk
            output/My-Attendance-v13.1-signed.apk.sha256
            output/apksigner-report.txt
            output/package-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Attendance-v13.1-Unsigned-APK
          path: output/My-Attendance-v13.1-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android build tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-35
          path: output/android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 7
