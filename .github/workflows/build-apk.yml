name: Build My Attendance APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare supplied app icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon.webp.b64 > app/src/main/res/drawable/app_icon.webp
          test -s app/src/main/res/drawable/app_icon.webp

      - name: Prepare v12.3 app
        shell: bash
        run: |
          set -e
          cat ci/v83_bundle.part* > /tmp/v83_bundle.b64
          test "$(wc -c < /tmp/v83_bundle.b64)" = "61564"
          base64 -d /tmp/v83_bundle.b64 > /tmp/v83_bundle.zip
          echo "e71c15e01ff07294f2df5989d88ff25704f8024c97323d40a7d3bb04e2415904  /tmp/v83_bundle.zip" | sha256sum -c -
          rm -f app/src/main/assets/index.html app/src/main/assets/app.css app/src/main/assets/app.js app/src/main/assets/extras.js app/src/main/assets/extras.css app/src/main/assets/navfix.js app/src/main/assets/lottie-runtime.js app/src/main/assets/profile-ui.js app/src/main/assets/cloud-ui.js app/src/main/assets/cloud-ui.css app/src/main/assets/v11-ui.js app/src/main/assets/v11-ui.css app/src/main/assets/v111-fixes.js app/src/main/assets/v112-fixes.js app/src/main/assets/v112-ui.css app/src/main/assets/v113-fixes.js app/src/main/assets/v113-ui.css app/src/main/assets/user-storage.js app/src/main/assets/xlsx.full.min.js app/src/main/assets/exceljs.min.js app/src/main/assets/firebase-config.json
          rm -rf app/src/main/assets/lottie app/src/main/assets/lottie-dark app/src/main/assets/lottie-white
          unzip -q -o /tmp/v83_bundle.zip -d app/src/main/assets

          cat ci/v9code.fix01a ci/v9code.fix01b ci/v9code.fix02a ci/v9code.fix02b ci/v9code.part03 ci/v9code.part04 > /tmp/v9code.b64
          test "$(wc -c < /tmp/v9code.b64)" = "24804"
          sed -i 's/H5dHCgTTiQ/H5dHCgTTgQ/' /tmp/v9code.b64
          base64 -d /tmp/v9code.b64 > /tmp/v9code.zip
          echo "3d9c671ef4c4cfd2165c7ab4320e31a36089e76190a0fb2e7ef1e191cce7b228  /tmp/v9code.zip" | sha256sum -c -
          unzip -q -o /tmp/v9code.zip -d app/src/main/assets

          python3 ci/prepare_v94.py app/src/main/assets
          python3 ci/patch_v95.py app/src/main/assets
          cp ci/cloud-ui.js app/src/main/assets/cloud-ui.js
          cp ci/cloud-ui.css app/src/main/assets/cloud-ui.css
          python3 ci/patch_v10.py app/src/main/assets
          python3 ci/patch_v11.py app/src/main/assets
          python3 ci/patch_v111.py app/src/main/assets
          cp ci/v11-ui.js app/src/main/assets/v11-ui.js
          cp ci/v11-ui.css app/src/main/assets/v11-ui.css
          cp ci/v111-fixes.js app/src/main/assets/v111-fixes.js
          cp ci/v112-fixes.js app/src/main/assets/v112-fixes.js
          cp ci/v112-ui.css app/src/main/assets/v112-ui.css
          cp ci/v113-fixes.js app/src/main/assets/v113-fixes.js
          cp ci/v113-ui.css app/src/main/assets/v113-ui.css
          python3 ci/patch_v112.py app/src/main/assets
          python3 ci/patch_v113.py app/src/main/assets
          cp ci/user-storage-v123.js app/src/main/assets/user-storage.js
          python3 ci/patch_v12.py app/src/main/assets
          python3 ci/patch_native_v11.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v12.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v121.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_native_v123.py app/src/main/java/com/personal/attendance/MainActivity.java
          python3 ci/patch_v122.py app/src/main/assets
          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js -o app/src/main/assets/lottie.min.js
          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          curl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js -o app/src/main/assets/exceljs.min.js
          cp ci/lottie-runtime.js app/src/main/assets/lottie-runtime.js

          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.css
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/profile-ui.js
          test -s app/src/main/assets/cloud-ui.js
          test -s app/src/main/assets/cloud-ui.css
          test -s app/src/main/assets/lottie-runtime.js
          test -s app/src/main/assets/v11-ui.js
          test -s app/src/main/assets/v11-ui.css
          test -s app/src/main/assets/v111-fixes.js
          test -s app/src/main/assets/v112-fixes.js
          test -s app/src/main/assets/v112-ui.css
          test -s app/src/main/assets/v113-fixes.js
          test -s app/src/main/assets/v113-ui.css
          test -s app/src/main/assets/user-storage.js
          test -s app/src/main/assets/xlsx.full.min.js
          test -s app/src/main/assets/exceljs.min.js
          test -s app/src/main/assets/lottie-dark/attendance.json
          test -s app/src/main/assets/lottie-white/punch.json
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/profile-ui.js
          node --check app/src/main/assets/cloud-ui.js
          node --check app/src/main/assets/lottie-runtime.js
          node --check app/src/main/assets/v11-ui.js
          node --check app/src/main/assets/v111-fixes.js
          node --check app/src/main/assets/v112-fixes.js
          node --check app/src/main/assets/v113-fixes.js
          node --check app/src/main/assets/user-storage.js
          grep -q 'window.initLottie' app/src/main/assets/lottie-runtime.js
          grep -q 'exceljs.min.js' app/src/main/assets/index.html
          grep -q 'deleteProfileBtn' app/src/main/assets/index.html
          grep -q 'exportExcelBtn' app/src/main/assets/index.html
          grep -q 'workProgressRing' app/src/main/assets/index.html
          grep -q 'settingsLogoutBtn' app/src/main/assets/index.html
          grep -q 'fontFamilySelect' app/src/main/assets/index.html
          grep -q 'v112-fixes.js' app/src/main/assets/index.html
          grep -q 'v113-fixes.js' app/src/main/assets/index.html
          grep -q 'user-storage.js' app/src/main/assets/index.html
          grep -q 'attendanceUserDb' app/src/main/assets/app.js
          grep -q 'attendanceSnapshotCurrentUser' app/src/main/assets/cloud-ui.js
          grep -q 'currentUserUid' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'PlayIntegrityAppCheckProviderFactory' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'firebase-appcheck-playintegrity' app/build.gradle
          grep -q 'secureStorageAvailable' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'my_attendance_local_aes_v1' app/src/main/java/com/personal/attendance/MainActivity.java
          grep -q 'attendanceSecureLocalStorage' app/src/main/assets/user-storage.js
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'Manual cloud backup ready' app/src/main/assets/cloud-ui.js
          grep -q 'profileDangerZone' app/src/main/assets/index.html
          grep -q 'confirmClockOut' app/src/main/assets/app.js
          grep -q 'isSpecialOTRecord' app/src/main/assets/app.js
          if grep -q '<script src="v111-fixes.js"' app/src/main/assets/index.html; then exit 1; fi
          grep -q 'dailyBalanceMinutes' app/src/main/assets/app.js
          if grep -q 'RE-PUNCH' app/src/main/assets/app.js; then exit 1; fi
          echo "v12.3 assets prepared successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Firebase build secret
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            echo "FIREBASE_API_KEY repository secret is missing."
            exit 1
          fi
          echo "Firebase build secret is configured."

      - name: Build unsigned release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare APK and official build tools
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/My-Attendance-v12.3-unsigned.apk
          tar -czf output/android-build-tools-35.tar.gz -C "$ANDROID_HOME/build-tools" 35.0.0

      - name: Sign APK with permanent release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Permanent Android signing secrets are not configured yet."
            echo "SIGNED_APK_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/my-attendance-release.jks"
          ALIGNED="$RUNNER_TEMP/My-Attendance-v12.3-aligned.apk"
          SIGNED="output/My-Attendance-v12.3-signed.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 output/My-Attendance-v12.3-unsigned.apk "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$KEYSTORE"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$SIGNED"             "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          rm -f "$KEYSTORE" "$ALIGNED"
          echo "SIGNED_APK_AVAILABLE=1" >> "$GITHUB_ENV"

      - name: Upload signed APK artifact
        if: env.SIGNED_APK_AVAILABLE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: My-Attendance-v12.3-Signed-APK
          path: output/My-Attendance-v12.3-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Attendance-v12.3-Unsigned-APK
          path: output/My-Attendance-v12.3-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android build tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-35
          path: output/android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 7
