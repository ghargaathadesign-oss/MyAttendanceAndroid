name: Build My Attendance APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare supplied app icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon.webp.b64 > app/src/main/res/drawable/app_icon.webp
          test -s app/src/main/res/drawable/app_icon.webp

      - name: Prepare v9 app and Lottie animations
        shell: bash
        run: |
          # Reuse the already-tested animation package from v8.3.
          cat ci/v83_bundle.part* > /tmp/v83_bundle.b64
          test "$(wc -c < /tmp/v83_bundle.b64)" = "61564"
          base64 -d /tmp/v83_bundle.b64 > /tmp/v83_bundle.zip
          echo "e71c15e01ff07294f2df5989d88ff25704f8024c97323d40a7d3bb04e2415904  /tmp/v83_bundle.zip" | sha256sum -c -
          unzip -t /tmp/v83_bundle.zip
          rm -f app/src/main/assets/index.html app/src/main/assets/app.css app/src/main/assets/app.js app/src/main/assets/extras.js app/src/main/assets/extras.css app/src/main/assets/navfix.js
          rm -rf app/src/main/assets/lottie
          unzip -q -o /tmp/v83_bundle.zip -d app/src/main/assets

          # Overlay the finished v9 UI + behavior while preserving the Lottie JSON assets.
          cat ci/v9code.part* > /tmp/v9code.b64
          test "$(wc -c < /tmp/v9code.b64)" = "24804"
          base64 -d /tmp/v9code.b64 > /tmp/v9code.zip
          echo "3d9c671ef4c4cfd2165c7ab4320e31a36089e76190a0fb2e7ef1e191cce7b228  /tmp/v9code.zip" | sha256sum -c -
          unzip -t /tmp/v9code.zip
          unzip -q -o /tmp/v9code.zip -d app/src/main/assets

          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js -o app/src/main/assets/lottie.min.js

          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.css
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/profile-placeholder.svg
          test -s app/src/main/assets/lottie/punch.json
          test -s app/src/main/assets/lottie/salary.json
          test -s app/src/main/assets/lottie/attendance.json
          test -s app/src/main/assets/lottie/settings.json
          test -s app/src/main/assets/lottie.min.js
          node --check app/src/main/assets/app.js
          grep -q 'Overtime Starts After Standard Duration' app/src/main/assets/index.html
          grep -q 'Salary Earned' app/src/main/assets/index.html
          grep -q 'screen-setting-appearance' app/src/main/assets/index.html
          grep -q 'for(i=0;i<60;i++)opt(m,i,P(i))' app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/My-Attendance-v9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Attendance-v9-APK
          path: output/My-Attendance-v9.apk
          if-no-files-found: error
          retention-days: 30
