name: Firebase Security Rules

on:
  workflow_dispatch:
  push:
    branches: [main, v12.6-hardening]
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'ci/test-storage-rules.mjs'
      - '.github/workflows/firebase-security.yml'

permissions:
  contents: read

jobs:
  test-storage-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase test tools
        run: npm install --no-save firebase-tools@latest firebase@latest @firebase/rules-unit-testing@latest
      - name: Run Storage Rules emulator tests
        run: npx firebase-tools emulators:exec --only storage --project demo-my-attendance "node ci/test-storage-rules.mjs"

  deploy-storage-rules:
    if: github.ref == 'refs/heads/main'
    needs: test-storage-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Deploy Storage Rules when deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; rules were tested but deployment is skipped."
            exit 0
          fi
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"
          chmod 600 "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
          firebase deploy --only storage --project my-attendance-c5c23 --non-interactive
          rm -f "$CREDS"


  configure-app-check:
    if: github.ref == 'refs/heads/main'
    needs: test-storage-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check Firebase deployment credentials
        id: creds
        shell: bash
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Firebase deployment credentials are not configured; App Check server configuration is skipped."
          fi
      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.available == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
      - name: Configure App Check Play Integrity for sideloaded APKs
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          APP_ID='1:312314814209:android:764780f6a72c65b9a38500'
          PROJECT_NUMBER='312314814209'
          NAME="projects/$PROJECT_NUMBER/apps/$APP_ID/playIntegrityConfig"
          URL="https://firebaseappcheck.googleapis.com/v1/$NAME?updateMask=appIntegrity.allowUnrecognizedVersion,deviceIntegrity.minDeviceRecognitionLevel,accountDetails.requireLicensed"
          cat > "$RUNNER_TEMP/app-check.json" <<JSON
          {
            "name": "$NAME",
            "appIntegrity": {"allowUnrecognizedVersion": true},
            "deviceIntegrity": {"minDeviceRecognitionLevel": "MEETS_DEVICE_INTEGRITY"},
            "accountDetails": {"requireLicensed": false}
          }
          JSON
          curl --fail-with-body --silent --show-error \
            -X PATCH "$URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/app-check.json" \
            | tee "$RUNNER_TEMP/app-check-response.json"
          grep -q '"allowUnrecognizedVersion": true' "$RUNNER_TEMP/app-check-response.json"
          grep -q '"minDeviceRecognitionLevel": "MEETS_DEVICE_INTEGRITY"' "$RUNNER_TEMP/app-check-response.json"
          rm -f "$RUNNER_TEMP/app-check.json" "$RUNNER_TEMP/app-check-response.json"
