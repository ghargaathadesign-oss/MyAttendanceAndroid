name: Firebase Production Security

on:
  workflow_dispatch:
    inputs:
      deploy_storage_rules:
        description: Deploy tested Cloud Storage Security Rules
        required: true
        type: boolean
        default: true
      configure_app_check:
        description: Configure Play Integrity for sideloaded APKs and enable monitoring
        required: true
        type: boolean
        default: true
      enforce_app_check:
        description: Enforce App Check for Cloud Storage (ONLY after valid-token monitoring)
        required: true
        type: boolean
        default: false
  push:
    branches: [main, firebase-production-security]
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'ci/test-storage-rules.mjs'
      - '.github/workflows/firebase-security.yml'
      - 'docs/FIREBASE_PRODUCTION_SECURITY.md'

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: my-attendance-c5c23
  FIREBASE_PROJECT_NUMBER: '312314814209'
  FIREBASE_ANDROID_APP_ID: '1:312314814209:android:764780f6a72c65b9a38500'

jobs:
  test-storage-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase test tools
        run: npm install --no-save firebase-tools@latest firebase@latest @firebase/rules-unit-testing@latest
      - name: Run Storage Rules emulator tests
        run: npx firebase-tools emulators:exec --only storage --project demo-my-attendance "node ci/test-storage-rules.mjs"

  backend-preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: test-storage-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Require Firebase deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_JSON."
            echo "::error::Create the least-privilege Firebase deployer described in docs/FIREBASE_PRODUCTION_SECURITY.md, then add its full JSON key as that repository secret."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])
          required={"type","project_id","private_key","client_email"}
          missing=sorted(required-set(data))
          if missing:
              raise SystemExit("Service account JSON is missing: "+", ".join(missing))
          if data.get("project_id")!="my-attendance-c5c23":
              raise SystemExit("Service account belongs to the wrong Google Cloud project")
          print("Firebase credential preflight passed")
          PY

  deploy-storage-rules:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_storage_rules))
    needs: [test-storage-rules, backend-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Deploy tested Cloud Storage rules
        shell: bash
        run: |
          set -euo pipefail
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"
          chmod 600 "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"

          # Pin the known Firebase Storage bucket explicitly. This avoids
          # relying on default-bucket auto-discovery while still using the
          # documented Firebase Storage deploy-target mechanism.
          cat > firebase.deploy.json <<'JSON'
          {
            "storage": [
              {
                "target": "main",
                "rules": "storage.rules"
              }
            ]
          }
          JSON
          cat > .firebaserc <<JSON
          {
            "projects": {
              "default": "$FIREBASE_PROJECT_ID"
            },
            "targets": {
              "$FIREBASE_PROJECT_ID": {
                "storage": {
                  "main": [
                    "$FIREBASE_PROJECT_ID.firebasestorage.app"
                  ]
                }
              }
            }
          }
          JSON

          firebase deploy             --config firebase.deploy.json             --only storage:main             --project "$FIREBASE_PROJECT_ID"             --non-interactive

          rm -f "$CREDS" firebase.deploy.json .firebaserc
          echo "### Firebase Storage Rules" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Tested rules deployed to **$FIREBASE_PROJECT_ID**." >> "$GITHUB_STEP_SUMMARY"

  configure-app-check:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.configure_app_check))
    needs: [test-storage-rules, backend-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create OAuth access token from service-account key
        id: auth
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          npm install --no-save google-auth-library@latest >/dev/null 2>&1
          ACCESS_TOKEN="$(node - <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const creds=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
            const auth=new GoogleAuth({credentials:creds,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const out=await client.getAccessToken();
            const token=typeof out==='string'?out:out&&out.token;
            if(!token) throw new Error('No Google OAuth access token returned');
            process.stdout.write(token);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          )"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Configure Play Integrity for APKs distributed outside Google Play
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          NAME="projects/$FIREBASE_PROJECT_NUMBER/apps/$FIREBASE_ANDROID_APP_ID/playIntegrityConfig"
          URL="https://firebaseappcheck.googleapis.com/v1/$NAME?updateMask=appIntegrity.allowUnrecognizedVersion,deviceIntegrity.minDeviceRecognitionLevel,accountDetails.requireLicensed"
          cat > "$RUNNER_TEMP/app-check.json" <<JSON
          {
            "name": "$NAME",
            "appIntegrity": {"allowUnrecognizedVersion": true},
            "deviceIntegrity": {"minDeviceRecognitionLevel": "MEETS_DEVICE_INTEGRITY"},
            "accountDetails": {"requireLicensed": false}
          }
          JSON
          curl --fail-with-body --silent --show-error             -X PATCH "$URL"             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/app-check.json"             > "$RUNNER_TEMP/app-check-response.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"app-check-response.json")
          data=json.load(open(p))
          assert data["appIntegrity"]["allowUnrecognizedVersion"] is True
          assert data["deviceIntegrity"]["minDeviceRecognitionLevel"]=="MEETS_DEVICE_INTEGRITY"
          assert data.get("accountDetails",{}).get("requireLicensed",False) is False
          print("Play Integrity configuration verified")
          PY
          rm -f "$RUNNER_TEMP/app-check.json" "$RUNNER_TEMP/app-check-response.json"

      - name: Put Cloud Storage App Check in monitoring-only mode
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          SERVICE="projects/$FIREBASE_PROJECT_NUMBER/services/firebasestorage.googleapis.com"
          URL="https://firebaseappcheck.googleapis.com/v1/$SERVICE?updateMask=enforcementMode"
          curl --fail-with-body --silent --show-error             -X PATCH "$URL"             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data '{"name":"'"$SERVICE"'","enforcementMode":"UNENFORCED"}'             > "$RUNNER_TEMP/storage-app-check.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"storage-app-check.json")
          data=json.load(open(p))
          assert data["enforcementMode"]=="UNENFORCED"
          print("Cloud Storage App Check monitoring mode verified")
          PY
          rm -f "$RUNNER_TEMP/storage-app-check.json"
          echo "### Firebase App Check" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Play Integrity configured for sideloaded APKs." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Cloud Storage is in **UNENFORCED / monitoring-only** mode." >> "$GITHUB_STEP_SUMMARY"
          echo "Enforcement is intentionally separate so legitimate v13.2 users are not locked out." >> "$GITHUB_STEP_SUMMARY"

  enforce-storage-app-check:
    if: github.event_name == 'workflow_dispatch' && inputs.enforce_app_check
    needs: [configure-app-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create OAuth access token from service-account key
        id: auth
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          npm install --no-save google-auth-library@latest >/dev/null 2>&1
          ACCESS_TOKEN="$(node - <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const creds=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
            const auth=new GoogleAuth({credentials:creds,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const out=await client.getAccessToken();
            const token=typeof out==='string'?out:out&&out.token;
            if(!token) throw new Error('No Google OAuth access token returned');
            process.stdout.write(token);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          )"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Enforce App Check for Cloud Storage
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          SERVICE="projects/$FIREBASE_PROJECT_NUMBER/services/firebasestorage.googleapis.com"
          URL="https://firebaseappcheck.googleapis.com/v1/$SERVICE?updateMask=enforcementMode"
          curl --fail-with-body --silent --show-error             -X PATCH "$URL"             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data '{"name":"'"$SERVICE"'","enforcementMode":"ENFORCED"}'             > "$RUNNER_TEMP/storage-app-check-enforced.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"storage-app-check-enforced.json")
          data=json.load(open(p))
          assert data["enforcementMode"]=="ENFORCED"
          print("Cloud Storage App Check enforcement verified")
          PY
          rm -f "$RUNNER_TEMP/storage-app-check-enforced.json"
          echo "### Firebase App Check Enforcement" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Cloud Storage App Check is now **ENFORCED**." >> "$GITHUB_STEP_SUMMARY"
