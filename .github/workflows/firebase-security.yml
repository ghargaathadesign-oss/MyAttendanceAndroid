name: Firebase Security Rules

on:
  workflow_dispatch:
  push:
    branches: [main, v12.6-hardening]
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'ci/test-storage-rules.mjs'
      - '.github/workflows/firebase-security.yml'

permissions:
  contents: read

jobs:
  test-storage-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase test tools
        run: npm install --no-save firebase-tools@latest firebase@latest @firebase/rules-unit-testing@latest
      - name: Run Storage Rules emulator tests
        run: npx firebase-tools emulators:exec --only storage --project demo-my-attendance "node ci/test-storage-rules.mjs"

  deploy-storage-rules:
    if: github.ref == 'refs/heads/main'
    needs: test-storage-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Deploy Storage Rules when deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; rules were tested but deployment is skipped."
            exit 0
          fi
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"
          chmod 600 "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
          firebase deploy --only storage --project my-attendance-c5c23 --non-interactive
          rm -f "$CREDS"
