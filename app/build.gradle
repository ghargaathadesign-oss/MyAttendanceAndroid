plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.attendance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.attendance'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '15.4'

        def firebaseApiKey = System.getenv('FIREBASE_API_KEY') ?: ''
        def firebaseAppCheckEnabled = (System.getenv('FIREBASE_APP_CHECK_ENABLED') ?: 'false').toBoolean()
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + firebaseApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'FIREBASE_APP_CHECK_ENABLED', firebaseAppCheckEnabled.toString()

        // FirebaseInitProvider uses these resources so FCM can start the app process
        // and receive data messages even when MainActivity is not already running.
        resValue 'string', 'google_app_id', '1:312314814209:android:764780f6a72c65b9a38500'
        resValue 'string', 'gcm_defaultSenderId', '312314814209'
        resValue 'string', 'project_id', 'my-attendance-c5c23'
        resValue 'string', 'google_storage_bucket', 'my-attendance-c5c23.firebasestorage.app'
        resValue 'string', 'google_api_key', firebaseApiKey
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
