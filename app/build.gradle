plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.attendance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.attendance'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
